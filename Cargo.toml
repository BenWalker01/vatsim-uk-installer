[package]
name = "vatsim-uk-installer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = "0.35.0"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["ico"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = { version = "3", features = ["json"] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          (Get-Content Cargo.toml -Raw) -replace '(?m)^version = ".*"', "version = `"$v`"" | Set-Content Cargo.toml -NoNewline
          (Get-Content Cargo.lock -Raw) -replace '(name = "vatsim-uk-installer"\r?\nversion = )".*"', "`$1`"$v`"" | Set-Content Cargo.lock -NoNewline

      - name: Build (release)
        run: cargo build --release --locked

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vatsim-uk-installer
          path: target/release/vatsim-uk-installer.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: vatsim-uk-installer

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vatsim-uk-installer.exe
          generate_release_notes: true